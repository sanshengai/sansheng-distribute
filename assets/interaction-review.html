<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>互动审核</title>
<style>
:root{color-scheme:light;--ink:#153c42;--quiet:#62797c;--line:#d6e1e1;--paper:#f5f8f8;--green:#116250;--bad:#a0392b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 "PingFang SC","Noto Sans CJK SC",sans-serif}button,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:6px;padding:7px 12px}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--ink);color:white;border-color:var(--ink)}button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #16a18e;outline-offset:2px}header{border-bottom:1px solid var(--line);background:white;padding:20px 28px;display:flex;align-items:center;gap:22px}h1{font:600 25px/1.2 "Songti SC","Noto Serif CJK SC",serif;margin:0;white-space:nowrap}header p{margin:0;color:var(--quiet);font-size:12px;flex:1}.shell{display:grid;grid-template-columns:155px minmax(0,1fr);max-width:1680px;margin:auto}aside{padding:22px 15px;border-right:1px solid var(--line)}aside button{display:flex;width:100%;justify-content:space-between;border:0;margin-bottom:4px;background:transparent;text-align:left;font-size:13px}aside button[aria-pressed=true]{background:#dcece8;color:#13513f}aside p{font-size:11px;color:var(--quiet);padding:0 10px}main{min-width:0;padding:20px 24px 110px}.line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.line small{color:var(--quiet);flex:1}select{border:1px solid var(--line);border-radius:5px;padding:6px;color:var(--ink);background:white}#notice{padding:10px 0;font-size:12px;color:var(--quiet);min-height:37px}.error{color:var(--bad)!important}table{width:100%;border-collapse:collapse;background:white;table-layout:fixed;font-size:12px}th{font-weight:500;text-align:left;background:#eaf1f1;color:var(--quiet);padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:14px 12px;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th:first-child{width:36px}th:nth-child(2){width:135px}th:nth-child(3){width:34%}th:last-child{width:140px}td p{white-space:pre-wrap;margin:0 0 8px}td small{display:block;color:var(--quiet);font-size:11px}td strong{font-size:12px;font-weight:600}textarea{width:100%;resize:vertical;min-height:90px;border:1px solid var(--line);border-radius:5px;padding:9px;color:var(--ink);font-size:13px;line-height:1.65;background:#fcfefe}details{color:var(--quiet);font-size:11px;margin:7px 0}summary{cursor:pointer}.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.actions button{padding:3px 9px;font-size:11px}.tag{display:inline-block;padding:2px 7px;background:#edf4f3;color:var(--green);border-radius:3px;font-size:11px;margin-bottom:5px}.manual{background:#f6eee2;color:#8a6028}.empty{text-align:center;color:var(--quiet);padding:45px 15px}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:12px;box-shadow:0 -2px 10px #153c4208}footer small{flex:1;color:var(--quiet)}#results{margin-top:20px;font-size:12px}#results summary{font-size:13px;color:var(--ink)}.result-line{padding:6px 0;border-bottom:1px solid var(--line)}.pager{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;align-items:center;font-size:12px;color:var(--quiet)}
@media(max-width:850px){header{padding:15px;flex-wrap:wrap;gap:12px}.shell{grid-template-columns:1fr}aside{display:flex;gap:3px;overflow:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}aside button{width:auto;white-space:nowrap;gap:10px}aside p{display:none}main{padding:14px 12px 150px}.table-scroll{overflow:auto}table{min-width:780px}footer{flex-wrap:wrap;padding:10px 14px}footer small{flex-basis:100%}}
</style></head><body>
<header><h1>互动审核</h1><p>查看留言 → 修改建议 → 确认 → 发送已确认<br>本机控制台</p><button id="refresh">刷新收件箱</button></header>
<div class="shell"><aside id="platforms" aria-label="平台筛选"></aside><main>
<div class="line"><label><input type="checkbox" id="selectPage"> 选择本页可审核项</label><small id="summary">正在读取本机收件箱…</small><label>显示 <select id="status"><option value="pending">待处理</option><option value="all">全部留言</option></select></label></div>
<p id="coverage"></p><div id="notice" role="status" aria-live="polite"></div>
<div class="table-scroll"><table><thead><tr><th></th><th>平台与网友</th><th>原留言与上下文</th><th>回复建议 · 可直接修改</th><th>处理方式</th></tr></thead><tbody id="items"></tbody></table></div>
<div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div>
<details id="results"><summary>最近确认与发送结果</summary><div id="history"></div></details>
</main></div><footer><strong id="selected">已选 0 条</strong><small id="approval">修改后需要重新确认；未接通的平台可复制到平台回复。</small><button id="confirm">确认选中建议</button><button id="send" class="primary" disabled>发送已确认</button><button id="reconcile" disabled>核验原结果</button></footer>
<script nonce="__REVIEW_TOKEN__">
'use strict';
const token='__REVIEW_TOKEN__', $=id=>document.getElementById(id), labels={verified:'已核验回复',unknown:'结果待核验',attempting:'处理中',manual:'需人工回复',blocked:'被阻止',not_attempted:'未记录到发送尝试'};
let data={items:[],batches:[],platforms:{}}, filter='', page=0, batch=null, busy=false, dirty=false;
const selected=new Set(), edits=new Map();
function pruneSelection(){const eligible=new Set(data.items.filter(r=>r.eligible).map(r=>r.item_key));for(const k of selected)if(!eligible.has(k))selected.delete(k)}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function message(text,error=false){$('notice').textContent=text;$('notice').className=error?'error':''}
async function api(path,body){const options={headers:{'X-Review-Token':token}};if(body!==undefined){options.method='POST';options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}const response=await fetch(path,options);const value=await response.json();if(!response.ok)throw new Error(value.error||'操作未完成，请检查原结果');return value}
function invalidate(){batch=null;$('send').disabled=true;$('reconcile').disabled=true;$('approval').textContent='修改或选择已变化，请重新确认这一批文案。'}
function selection(){ $('selected').textContent='已选 '+selected.size+' 条';$('confirm').disabled=busy||!selected.size; }
function visible(){return data.items.filter(r=>(!filter||r.platform===filter)&&($('status').value==='all'||!r.handled))}
function time(value){if(!value)return '时间未记录';const d=new Date(value);return Number.isNaN(d.valueOf())?'时间待核对':d.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}
function platformNav(){const box=$('platforms');box.replaceChildren();for(const [id,name]of [['','全部平台'],...Object.entries(data.platforms)]){const count=data.items.filter(r=>(!id||r.platform===id)&&!r.handled).length;const b=node('button');b.append(node('span',name),node('span',String(count)));b.setAttribute('aria-pressed',String(filter===id));b.onclick=()=>{filter=id;page=0;render()};box.append(b)}box.append(node('p','数量来自本机已接入记录；0 不代表平台没有评论。'))}
function render(){pruneSelection();platformNav();
 const sources=(data.sources||[]).filter(s=>!filter||s.platform===filter), names={complete:'限定范围读取完成',partial:'部分读取',manual:'手工导入',error:'读取失败',running:'读取中'};
 $('coverage').textContent=sources.length?sources.map(s=>(data.platforms[s.platform]||s.platform)+'：'+(names[s.state]||s.state)+(s.last_success_at?' · '+time(s.last_success_at):'')).join('；')+'。这是本机记录，不代表全账号实时覆盖。':'该平台尚无标准收件箱记录，不能据此判断没有网友留言。';
 const list=visible(),pages=Math.max(1,Math.ceil(list.length/20));page=Math.min(page,pages-1);const shown=list.slice(page*20,page*20+20),body=$('items');body.replaceChildren();
 for(const r of shown){const tr=node('tr'),pick=node('td'),c=node('input');c.type='checkbox';c.checked=selected.has(r.item_key);c.disabled=!r.eligible||busy;c.setAttribute('aria-label','选择 '+r.author_name+' 的留言');c.onchange=()=>{if(c.checked)selected.add(r.item_key);else selected.delete(r.item_key);invalidate();selection()};pick.append(c);
 const who=node('td');who.append(node('strong',data.platforms[r.platform]||r.platform),node('small',r.account),node('p',r.author_name),node('small',time(r.published_at)));
 const original=node('td');original.append(node('p',r.comment));if(r.context.length){const d=node('details'),s=node('summary','展开已有对话（'+r.context.length+' 条）');d.append(s);for(const q of [...r.context].reverse())d.append(node('p',(q.is_own?'我':q.author_name||'网友')+'：'+(q.body||'')));original.append(d)}
 const reply=node('td'),input=node('textarea');input.value=edits.has(r.item_key)?edits.get(r.item_key):r.reply;input.disabled=!r.eligible||busy;input.maxLength=10000;input.setAttribute('aria-label','给 '+r.author_name+' 的回复建议');input.placeholder=r.eligible?'暂无建议，可在此输入回复':'此记录不进入待回复队列';input.oninput=()=>{edits.set(r.item_key,input.value);dirty=true;invalidate()};reply.append(input);if(r.suggestion)reply.append(node('small','建议依据：'+(r.suggestion.reason||'待作者核对')));
 const actions=node('div',undefined,'actions'),one=node('button','确认此条'),copy=node('button','复制回复');one.disabled=!r.eligible||busy;one.onclick=()=>confirmRows([r]);copy.onclick=async()=>{try{await navigator.clipboard.writeText(input.value);message('回复已复制。请在对应平台核对留言后发送。')}catch{message('复制失败，请选中文字复制。',true)}};actions.append(one,copy);reply.append(actions);
 const state=node('td');state.append(node('span',r.handled?r.status_label||'已标记处理':r.sendable?'API 发送路线':'人工接力','tag'+(!r.sendable?' manual':'')),node('small',r.reason||r.route_reason));tr.append(pick,who,original,reply,state);body.append(tr)}
 if(!shown.length){const tr=node('tr'),td=node('td',data.items.length?'当前筛选没有待处理留言；可切换“全部留言”查看已有记录。未接入平台仍需查看官方后台。':'这里还没有已接入的留言。平台读取未完成时，请先完成接入或查看官方后台。','empty');td.colSpan=5;tr.append(td);body.append(tr)}
 $('summary').textContent='当前筛选 '+list.length+' 条'+(data.truncated?'；仅载入最近500条':'')+(data.pending_context?' · 另有 '+data.pending_context+' 条待补上下文':'');$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;$('selectPage').checked=!!shown.length&&shown.filter(r=>r.eligible).length>0&&shown.filter(r=>r.eligible).every(r=>selected.has(r.item_key));selection();renderHistory();}
function renderHistory(){const out=$('history');out.replaceChildren();for(const b of data.batches){const d=node('details'),s=node('summary',time(b.confirmed_at)+' · 确认 '+b.count+' 条');d.append(s);if(!b.results.length)d.append(node('p','已确认，尚未交给发送器。'));for(const r of b.results){const target=data.items.find(q=>['platform','account','channel_id','comment_id'].every(k=>q[k]===r[k]));d.append(node('div',(data.platforms[r.platform]||r.platform||'YouTube')+' · '+(target?target.author_name:r.comment_id||'原留言')+' · '+(labels[r.state]||r.state)+'：'+r.reason,'result-line'))}const check=node('button','核验这一批');check.disabled=busy||!b.results.length;check.onclick=()=>runBatch(b.batch_id,true);d.append(check);out.append(d)}if(!data.batches.length)out.append(node('p','尚无确认批次。'));}
async function refresh(){if(busy)return;try{data=await api('/api/state');render();message('已刷新本机收件箱。平台巡检按原计划运行；页面本身不重新扫描平台。')}catch(e){message(e.message,true)}}
function payload(r){const value={};for(const k of ['platform','account','channel_id','comment_id','source_digest','draft_key'])value[k]=r[k];value.reply=edits.has(r.item_key)?edits.get(r.item_key):r.reply;return value}
async function confirmRows(rows){
 if(busy)return;
 if(!rows.length||rows.length>20){message('每批请选择1至20条；可分批确认。',true);return}
 const items=rows.map(payload);busy=true;render();
 try{
  const res=await api('/api/confirm',{items});batch=res.batch_id;
  for(const r of res.accepted){const original=rows.find(q=>['platform','account','channel_id','comment_id'].every(k=>q[k]===r[k]));if(original)edits.delete(original.item_key)}
  dirty=edits.size>0;
  data=await api('/api/state');
  $('send').disabled=!batch||!res.sendable;$('reconcile').disabled=!batch;
  $('approval').textContent='本批已确认 '+res.confirmed+' 条，其中 '+res.sendable+' 条已配置 API 路线；点击发送后仍会逐条核对。';
  message('已确认 '+res.confirmed+' 条'+(res.errors.length?'；'+res.errors.length+' 条未通过：'+res.errors.map(e=>e.reason).join('；'):''),!!res.errors.length);
 }catch(e){invalidate();message(e.message,true)}finally{busy=false;render()}
}
async function runBatch(id,reconcile=false){
 if(busy||!id)return;
 busy=true;$('send').disabled=true;$('reconcile').disabled=true;render();
 message(reconcile?'正在核验原结果，不会重发…':'正在逐条处理已确认回复，请保留页面；结果不明时不会自动重发…');
 try{
  const r=await api(reconcile?'/api/reconcile':'/api/send',{batch_id:id});
  data=await api('/api/state');$('results').open=true;
  const good=r.results.filter(x=>x.state==='verified').length;
  message('本批 '+r.results.length+' 条：已核验 '+good+' 条，其余请看下方具体原因。');batch=id;$('reconcile').disabled=false;
 }catch(e){message(e.message,true);$('reconcile').disabled=false}
 finally{busy=false;render()}
}
 $('refresh').onclick=refresh;$('confirm').onclick=()=>confirmRows(data.items.filter(r=>selected.has(r.item_key)));$('send').onclick=()=>runBatch(batch);$('reconcile').onclick=()=>runBatch(batch,true);$('status').onchange=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('selectPage').onchange=()=>{const checked=$('selectPage').checked;for(const r of visible().slice(page*20,page*20+20).filter(r=>r.eligible)){if(checked)selected.add(r.item_key);else selected.delete(r.item_key)}invalidate();render()};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});refresh();
</script></body></html>
